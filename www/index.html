<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gravity Flip</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0;background:#0b1020;color:#fff;overflow:hidden;font-family:Fredoka,system-ui,sans-serif}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#hud{position:fixed;top:0;left:0;display:flex;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) 10px 0;z-index:20}
.chip{display:flex;align-items:center;gap:6px;background:#000a;border:1px solid #fff3;border-radius:999px;padding:4px 4px 4px 12px;font-weight:700;font-size:18px;backdrop-filter:blur(6px)}
.chip b{min-width:28px;text-align:right}
.plus{width:28px;height:28px;border-radius:50%;border:0;background:linear-gradient(135deg,#5df29b,#17b978);color:#04301c;font:700 20px/1 Fredoka,sans-serif;cursor:pointer}
#quit,#snd{position:fixed;z-index:20;right:10px;width:42px;height:42px;border-radius:50%;border:1px solid #fff3;background:#000a;color:#fff;font-size:18px;cursor:pointer}
#quit{top:calc(env(safe-area-inset-top,0px) + 10px);display:none}
#snd{bottom:calc(env(safe-area-inset-bottom,0px) + 10px)}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:10;padding:calc(env(safe-area-inset-top,0px) + 64px) 14px 20px;overflow:auto;text-align:center}
.scr.on{display:flex}
#iap{z-index:30;background:#000b}
.logo{font-size:clamp(46px,12vw,100px);font-weight:700;letter-spacing:2px;line-height:.92;margin:0 0 6px;background:linear-gradient(90deg,#ff6ad5,#ffd36a,#5df2ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 18px #000a);animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px) scale(1.03)}}
.sub{opacity:.8;margin:0 0 24px}
.btn{font:700 20px Fredoka,sans-serif;color:#fff;border:0;border-radius:18px;padding:12px 26px;margin:6px;cursor:pointer;background:linear-gradient(135deg,#7c5cff,#3ea8ff);box-shadow:0 6px 0 #1c2a78,0 10px 24px #0006;min-width:200px;transition:transform .1s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #1c2a78}
.btn.big{font-size:30px;padding:16px 44px;background:linear-gradient(135deg,#ff6ad5,#ff9f43);box-shadow:0 6px 0 #9b2a73,0 10px 24px #0006}
.btn.alt{background:linear-gradient(135deg,#444c7a,#2b3158);box-shadow:0 6px 0 #161a3a;min-width:120px;font-size:16px;padding:8px 18px}
h2{margin:0 0 14px;font-size:32px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;width:min(920px,100%)}
.card{background:#000a;border:2px solid #fff3;border-radius:18px;padding:10px;cursor:pointer;backdrop-filter:blur(6px);font-weight:500}
.card.sel{border-color:#5df29b}.card.lock{opacity:.4}
.card .pv{height:64px;border-radius:12px;margin-bottom:6px;display:flex;align-items:center;justify-content:center;font-size:30px}
.card small{display:block;opacity:.85}
.lv{font-size:22px;font-weight:700;padding:14px 4px}
.msg{font-size:18px;margin:6px 0 14px}
.pack{display:flex;justify-content:space-between;align-items:center;gap:14px;background:#1a2050;border:2px solid #fff3;border-radius:16px;padding:12px 16px;margin:6px 0;width:min(380px,92vw);font-size:20px;font-weight:700;cursor:pointer}
.pack span{background:#5df29b;color:#04301c;border-radius:999px;padding:4px 14px}
#toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:#000d;border:1px solid #fff4;border-radius:999px;padding:10px 20px;z-index:40;opacity:0;transition:opacity .3s;pointer-events:none}
.ic{display:inline-block;width:16px;height:16px;vertical-align:-3px;margin:0 3px}.ic.coin{border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a0,#ffc400 55%,#c78b00);border:2px solid #c78b00}.ic.gem{width:12px;height:12px;margin:0 5px;transform:rotate(45deg);background:linear-gradient(135deg,#aef3ff,#3ea8ff 55%,#7c5cff);border:2px solid #fff8;border-radius:3px}#snd.m{opacity:.4;text-decoration:line-through}</style></head><body>
<canvas id="cv"></canvas>
<div id="hud">
 <div class="chip"><i class="ic coin"></i><b id="c">0</b><button class="plus" onclick="iap('coins')">+</button></div>
 <div class="chip"><i class="ic gem"></i><b id="g">0</b><button class="plus" onclick="iap('gems')">+</button></div>
</div>
<button id="quit" onclick="quit()">✕</button><button id="snd" onclick="mute()">🔊</button>
<div class="scr on" id="menu"></div><div class="scr" id="map"></div><div class="scr" id="lvls"></div>
<div class="scr" id="shop"></div><div class="scr" id="skins"></div><div class="scr" id="end"></div>
<div class="scr" id="iap"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
let S={coins:0,gems:0,done:0,skins:[0],skin:0,themes:[0],theme:0,mute:false};
try{Object.assign(S,JSON.parse(localStorage.getItem("gflip1")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("gflip1",JSON.stringify(S))}catch(e){}};

/* ---------- Données ---------- */
const WN=["Prairie","Bonbonland","Néon City","Cosmos","Jungle","Désert","Abysses","Volcan","Banquise","Cyber","Nébuleuse","Zénith"];
const cnt=w=>15+Math.round(w*15/11);
const WS=[];let TOT=0;WN.forEach((_,w)=>{WS.push(TOT);TOT+=cnt(w)});
const lvOf=g=>{let w=0;while(w<WN.length-1&&g>=WS[w+1])w++;return{w,l:g-WS[w],n:cnt(w)}};
const TH=[["Classique","#1b2a5a","#0e1433","#34479a","#ff5470","✦",0],["Bonbons","#ff9ad5","#ffd6f2","#ff5fb0","#7a3cff","🍬",10],["Néon","#1a0033","#05000f","#00b8d4","#ff2bd6","✦",20],["Espace","#0b0f2e","#000005","#3a3f7a","#ffb347","⭐",30],["Jungle","#1d6b3a","#0a2f1b","#6b4a2b","#ff7a1a","🍃",45],["Désert","#ffcf7a","#e07b39","#a8552a","#5a2a14","🌵",60],["Océan","#1b8fd6","#06285a","#0f4c81","#ff7a8a","🐠",80],["Lave","#3a0a0a","#120202","#6a2020","#ffcc00","🔥",100],["Glace","#cdf3ff","#6ab7e8","#5f93b8","#2e4a7a","❄️",130],["Cyberpunk","#12002b","#2b0a5a","#3a3a8a","#fcee0a","◆",160]];
const SK=[["Classique","#ffd23f","#ff9f1c"],["Menthe","#7dffd8","#17b58f"],["Fraise","#ff7aa2","#e0245e"],["Océan","#5cc8ff","#1769d6"],["Violet","#c28bff","#6a2fd6"],["Citron","#f4ff6a","#b6d300"],["Bonbon","#ff9ee6","#ff5fbf"],["Glace","#e6fbff","#8fd8ee"],["Lave","#ff8a3d","#c4180b"],["Forêt","#78e36b","#1f8a3a"],["Soleil","#fff27a","#ffa51f"],["Galaxie","#7a6bff","#1b1659"],["Néon","#39ff88","#00b050"],["Cyber","#00f0ff","#ff00c8"],["Chocolat","#b9774a","#5a2d17"],["Fantôme","#ffffff","#b9c2d6"],["Rubis","#ff4d6d","#8f0a2d"],["Saphir","#4d7cff","#0c2a8f"],["Émeraude","#33e6a0","#0a7a53"],["Or","#ffe27a","#d89a00"],["Diamant","#b9f3ff","#ff9ef2"],["Obsidienne","#4a4a5c","#0d0d14"],["Plasma","#ff5af0","#5aa0ff"],["Légende","#ffd700","#ff2d95"]];
const skCost=i=>i?Math.round((i*i*9+i*40)/10)*10:0;
const PACKS={coins:[[500,"0,99"],[1500,"2,99"],[4000,"5,99"],[10000,"9,99"],[30000,"24,99"]],gems:[[20,"0,99"],[60,"2,99"],[150,"5,99"],[400,"9,99"],[1000,"24,99"]]};

/* ---------- Canvas ---------- */
const cv=$("#cv"),cx=cv.getContext("2d");
const H=400,PT=46,SZ=34;let sc=1,W=800,dpr=1;
function rs(){dpr=Math.min(devicePixelRatio||1,2);cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;sc=innerHeight/H;W=innerWidth/sc}
addEventListener("resize",rs);rs();

function drawSkin(c,x,y,s,i,rot){const k=SK[i],g=c.createLinearGradient(-s/2,-s/2,s/2,s/2);g.addColorStop(0,k[1]);g.addColorStop(1,k[2]);
 c.save();c.translate(x,y);c.rotate(rot);
 c.fillStyle=g;c.strokeStyle="rgba(255,255,255,.7)";c.lineWidth=s*.07;c.beginPath();c.roundRect(-s/2,-s/2,s,s,s*.28);c.fill();c.stroke();
 c.fillStyle="rgba(0,0,0,.55)";const d=i%6,e=s*.12;
 if(d==0||d==5){c.fillStyle="#fff";c.beginPath();c.arc(-s*.17,-s*.08,e,0,7);c.arc(s*.17,-s*.08,e,0,7);c.fill();c.fillStyle="#111";c.beginPath();c.arc(-s*.14,-s*.08,e*.5,0,7);c.arc(s*.2,-s*.08,e*.5,0,7);c.fill();if(d==5){c.strokeStyle="#111";c.lineWidth=s*.06;c.beginPath();c.arc(0,s*.08,s*.17,.2,Math.PI-.2);c.stroke()}}
 if(d==1){c.fillRect(-s/2+3,-s*.1,s-6,s*.2)}
 if(d==2){c.beginPath();c.arc(0,0,s*.2,0,7);c.fill()}
 if(d==3){c.fillRect(-s*.07,-s*.35,s*.14,s*.7);c.fillRect(-s*.35,-s*.07,s*.7,s*.14)}
 if(d==4){c.strokeStyle="rgba(0,0,0,.45)";c.lineWidth=s*.08;c.beginPath();c.roundRect(-s*.25,-s*.25,s*.5,s*.5,s*.1);c.stroke()}
 c.restore()}

/* ---------- Audio ---------- */
let AC,mg,mi=0,nt=0;
const CH=[[57,60,64,67],[53,57,60,64],[48,52,55,59],[55,59,62,65]],mf=n=>440*Math.pow(2,(n-69)/12);
function tone(f,t,d,ty,v,dest){const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+Math.min(.5,d/3));g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(dest);o.start(t);o.stop(t+d+.05)}
function sched(){while(nt<AC.currentTime+.5){const ch=CH[Math.floor(mi/8)%4],st=mi%8;
 if(st==0){ch.forEach(n=>tone(mf(n),nt,3.1,"triangle",.05,mg));tone(mf(ch[0]-24),nt,2.8,"sine",.14,mg)}
 if(st%2==0||Math.random()<.3)tone(mf(ch[Math.floor(Math.random()*4)]+12),nt,1,"sine",.06,mg);
 nt+=.375;mi++}}
function audio(){if(AC){if(AC.state=="suspended")AC.resume();return}
 try{AC=new(window.AudioContext||window.webkitAudioContext)();mg=AC.createGain();mg.gain.value=S.mute?0:.6;mg.connect(AC.destination);nt=AC.currentTime+.1;setInterval(sched,150)}catch(e){}}
function sfx(f,d,ty,v){if(!AC||S.mute)return;tone(f,AC.currentTime,d,ty||"sine",v||.12,AC.destination)}
function mute(){S.mute=!S.mute;save();if(mg)mg.gain.value=S.mute?0:.6;$("#snd").textContent=S.mute?"🔇":"🔊"}
addEventListener("pointerdown",audio,{once:false});

/* ---------- Niveaux ---------- */
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
function gen(g){const d=g/TOT,r=rng(g*7919+13),sp=300+d*250,ft=.27-d*.06,v=lvOf(g),boss=v.l==v.n-1;
 const n=12+Math.floor(d*34)+(boss?8:0)+v.l%5;let end=700,pl=-1;const obs=[],coins=[];
 for(let i=0;i<n;i++){
  const q=r();let tp="s";if(d>.55&&q<.12)tp="m";else if(d>.3&&q<.3)tp="w";else if(d>.1&&q<.5)tp="b";
  const lane=pl<0?(r()<.5?0:1):(r()<.3?pl:1-pl);
  const w=tp=="s"?30*Math.min(3,1+Math.floor(r()*(1+d*2.2))):tp=="b"?44:40,h=tp=="s"?30:tp=="b"?52:40;
  let gap=(lane==pl&&tp!="m")?sp*(.2+(1-d)*.45+r()*.3):sp*(ft+.22+(1-d)*.55+r()*.35);
  if(tp=="m")gap*=1.3;
  const x=end+gap;
  if(i>0&&r()<.55){const m=(end+x)/2,cl=1-lane;coins.push({x:m,lane:cl});if(gap>260&&r()<.6){coins.push({x:m-36,lane:cl});coins.push({x:m+36,lane:cl})}}
  obs.push({t:tp,x,lane,w,h});end=x+w;pl=tp=="m"?-1:lane}
 return{obs,coins,L:end+500,sp,ft,d,boss}}

/* ---------- État ---------- */
let st="menu",cur=0,lv=null,dist=0,tm=0,P,parts=[],lvCoins=0,deadT=0,demoT=0,last=0;
const laneY=l=>l?H-PT-SZ:PT,ease=t=>t*t*(3-2*t);
function resetP(){P={lane:1,from:1,fl:false,t:0,rot:0,buf:0}}resetP();
function flip(){if(P.fl){P.buf=.15;return}P.fl=true;P.t=0;P.from=P.lane;P.lane=1-P.lane;sfx(520,.12,"triangle",.1)}
function cubeY(){return P.fl?laneY(P.from)+(laneY(P.lane)-laneY(P.from))*ease(P.t):laneY(P.lane)}
const cx0=()=>st=="menu"?Math.min(W*.2,140):Math.min(W*.25,180);

function play(g){audio();cur=g;lv=gen(g);dist=0;tm=0;parts=[];lvCoins=0;resetP();st="play";go("none");$("#quit").style.display="block"}
function quit(){st="menu";lv=null;dist=0;$("#quit").style.display="none";go("lvls");rLv(lvOf(cur).w)}
function boom(x,y,col){for(let i=0;i<26;i++)parts.push({x,y,vx:(Math.random()-.5)*500,vy:(Math.random()-.5)*500,l:1,c:col})}
function die(){st="dead";deadT=.8;sfx(110,.4,"sawtooth",.15);boom(cx0()+SZ/2,cubeY()+SZ/2,SK[S.skin][1])}
function circ(cx_,cy_,r,b){const nx=Math.max(b.x,Math.min(cx_,b.x+b.w)),ny=Math.max(b.y,Math.min(cy_,b.y+b.h));return(cx_-nx)**2+(cy_-ny)**2<r*r}

function upd(dt){
 tm+=dt;
 if(st=="menu"){dist+=140*dt;demoT+=dt;if(demoT>1.3){demoT=0;flip()}}
 if(P.fl){const ft=lv?lv.ft:.26;P.t+=dt/ft;if(P.t>=1){P.t=1;P.fl=false;P.rot+=Math.PI;if(P.buf>0){P.buf=0;flip()}}}
 P.buf-=dt;
 parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=600*dt;p.l-=dt});parts=parts.filter(p=>p.l>0);
 if(st=="dead"){deadT-=dt;if(deadT<=0){st="over";endScr(false)}}
 if(st!="play")return;
 dist+=lv.sp*dt;
 const X=cx0(),y=cubeY(),cb={x:X+5,y:y+5,w:SZ-10,h:SZ-10};
 for(const o of lv.obs){const sx=X+o.x-dist;if(sx>X+320)break;if(sx+o.w<X-20)continue;
  let hit=false;const top=o.lane==0;
  if(o.t=="s"){const hh=o.h*.7;hit=circ(0,0,0,{x:0,y:0,w:0,h:0})||(cb.x<sx+o.w*.88&&cb.x+cb.w>sx+o.w*.12&&cb.y<(top?PT+hh:H)&&cb.y+cb.h>(top?0:H-PT-hh))}
  else if(o.t=="b"){hit=cb.x<sx+o.w&&cb.x+cb.w>sx&&cb.y<(top?PT+o.h:H)&&cb.y+cb.h>(top?0:H-PT-o.h)}
  else if(o.t=="w"){hit=circ(sx+20,top?PT+8:H-PT-8,17,cb)}
  else if(o.t.length>1){hit=hitNew(o,sx,cb)}else{hit=circ(sx+20,mvY(o),16,cb)}
  if(hit){die();return}}
 for(const c of lv.coins){if(c.got)continue;const sx=X+c.x-dist;if(sx>X+60)break;
  if(Math.abs(sx+SZ/2-(X+SZ/2))<24&&Math.abs(laneY(c.lane)+SZ/2-(y+SZ/2))<26){c.got=1;S.coins++;lvCoins++;hud();sfx(988,.15,"sine",.12);boom(sx,laneY(c.lane)+SZ/2,"#ffd23f")}}
 if(dist>=lv.L){st="over";win()}}
const mvY=o=>H/2+Math.sin(tm*2.6+o.x*.01)*(H/2-PT-12);

function win(){const first=cur==S.done,v=lvOf(cur),gems=first?(v.l==v.n-1?3:1):0,bonus=10+Math.floor(lv.d*40);
 S.coins+=bonus;S.gems+=gems;if(first&&cur<TOT)S.done=cur+1;save();hud();sfx(784,.3,"triangle",.14);setTimeout(()=>sfx(1046,.4,"triangle",.14),150);
 endScr(true,bonus,gems)}

/* ---------- Dessin ---------- */
function drawBg(){const T=TH[S.theme];cx.setTransform(dpr*sc,0,0,dpr*sc,0,0);
 const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,T[1]);g.addColorStop(1,T[2]);cx.fillStyle=g;cx.fillRect(0,0,W+2,H);
 cx.font="26px Fredoka,sans-serif";cx.globalAlpha=.55;cx.fillStyle="#fff";cx.textBaseline="middle";
 for(let i=0;i<16;i++){const sp=.08+(i%3)*.06,ww=W+100;const x=((i*173-dist*sp)%ww+ww)%ww-50;cx.fillText(T[5],x,60+(i*97)%(H-120))}
 cx.globalAlpha=1;
 cx.fillStyle=T[3];cx.fillRect(0,0,W+2,PT);cx.fillRect(0,H-PT,W+2,PT);cx.fillStyle="rgba(255,255,255,.35)";cx.fillRect(0,PT-3,W+2,3);cx.fillRect(0,H-PT,W+2,3)}
function drawGame(){const T=TH[S.theme],X=cx0();
 if(lv){
  const fx=X+lv.L-dist;cx.fillStyle="#fff";for(let i=0;i<8;i++){cx.fillStyle=i%2?"#fff":"#222";cx.fillRect(fx,PT+i*(H-2*PT)/8,14,(H-2*PT)/8)}
  for(const c of lv.coins){if(c.got)continue;const sx=X+c.x-dist;if(sx<-40||sx>W+40)continue;cx.fillStyle="#ffd23f";cx.strokeStyle="#c78b00";cx.lineWidth=3;cx.beginPath();cx.ellipse(sx+SZ/2,laneY(c.lane)+SZ/2,10*Math.abs(Math.cos(tm*4))+3,12,0,0,7);cx.fill();cx.stroke()}
  for(const o of lv.obs){const sx=X+o.x-dist;if(sx>W+60||sx+o.w<-60)continue;const top=o.lane==0,by=top?PT:H-PT,dir=top?1:-1;cx.fillStyle=T[4];
   if(o.t=="s"){for(let k=0;k<o.w/30;k++){cx.beginPath();cx.moveTo(sx+k*30,by);cx.lineTo(sx+k*30+15,by+dir*o.h);cx.lineTo(sx+k*30+30,by);cx.fill()}}
   else if(o.t=="b"){cx.beginPath();cx.roundRect(sx,top?by:by-o.h,o.w,o.h,8);cx.fill();cx.fillStyle="rgba(0,0,0,.25)";cx.fillRect(sx+8,(top?by:by-o.h)+8,o.w-16,o.h-16)}
   else if(o.t.length>1){drawNew(o,sx,by,dir)}else{const yy=o.t=="w"?by+dir*8:mvY(o);cx.save();cx.translate(sx+20,yy);cx.rotate(tm*7);cx.beginPath();for(let k=0;k<16;k++){const a=k*Math.PI/8,rr=k%2?12:20;cx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}cx.fill();cx.fillStyle="rgba(0,0,0,.35)";cx.beginPath();cx.arc(0,0,5,0,7);cx.fill();cx.restore()}}
  if(st=="play"||st=="dead"||st=="over"){const p=Math.min(1,dist/lv.L),bw=Math.min(300,W*.4);cx.fillStyle="rgba(0,0,0,.4)";cx.beginPath();cx.roundRect(W/2-bw/2,16,bw,12,6);cx.fill();cx.fillStyle="#5df29b";cx.beginPath();cx.roundRect(W/2-bw/2,16,Math.max(8,bw*p),12,6);cx.fill();
   const v=lvOf(cur);cx.fillStyle="#fff";cx.font="700 14px Fredoka,sans-serif";cx.textAlign="center";cx.fillText(`Monde ${v.w+1} · Niveau ${v.l+1}`,W/2,H-PT+24);cx.textAlign="left"}}
 if(st!="dead"&&st!="over"||(st=="over"&&lv&&dist>=lv.L)){cx.shadowColor=SK[S.skin][1];cx.shadowBlur=14;drawSkin(cx,X+SZ/2,cubeY()+SZ/2,SZ,S.skin,P.rot+(P.fl?ease(P.t)*Math.PI:0));cx.shadowBlur=0}
 parts.forEach(p=>{cx.globalAlpha=Math.max(0,p.l);cx.fillStyle=p.c;cx.fillRect(p.x,p.y,7,7)});cx.globalAlpha=1}
function loop(ts){const dt=Math.min(.033,(ts-last)/1000||0);last=ts;upd(dt);drawBg();drawGame();requestAnimationFrame(loop)}

/* ---------- Écrans ---------- */
const scrs=["menu","map","lvls","shop","skins","end"];
function go(n){scrs.forEach(s=>$("#"+s).classList.toggle("on",s==n));if(n!="none"){st="menu"}if(n=="menu")rMenu();if(n=="map")rMap();if(n=="shop")rShop();if(n=="skins")rSk()}
function hud(){$("#c").textContent=S.coins;$("#g").textContent=S.gems}

{const od=drawGame;drawGame=function(){drawTrail();const k=P.sq||0,v=P.fl?6*P.t*(1-P.t):0;SQ={x:1+.3*k-.15*v,y:1-.3*k+.3*v,dy:.3*k*SZ/2*(P.lane?1:-1)};od();SQ=null}}

function glyph(k,x,y,s){cx.beginPath();
 if(k=="star"){for(let i=0;i<8;i++){const a=i*Math.PI/4,r=i%2?s*.3:s;cx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r)}cx.closePath();cx.fill()}
 else if(k=="candy"){cx.ellipse(x,y,s*.6,s*.45,0,0,7);cx.fill();cx.beginPath();cx.moveTo(x-s*.6,y);cx.lineTo(x-s,y-s*.4);cx.lineTo(x-s,y+s*.4);cx.moveTo(x+s*.6,y);cx.lineTo(x+s,y-s*.4);cx.lineTo(x+s,y+s*.4);cx.fill()}
 else if(k=="diamond"){cx.moveTo(x,y-s);cx.lineTo(x+s*.7,y);cx.lineTo(x,y+s);cx.lineTo(x-s*.7,y);cx.fill()}
 else if(k=="leaf"){cx.ellipse(x,y,s,s*.5,.6,0,7);cx.fill()}
 else if(k=="cactus"){cx.roundRect(x-s*.25,y-s,s*.5,s*2,s*.25);cx.roundRect(x-s*.7,y-s*.2,s*1.4,s*.3,s*.15);cx.fill()}
 else if(k=="bubble"){cx.arc(x,y,s*.7,0,7);cx.stroke()}
 else if(k=="flame"){cx.moveTo(x,y-s);cx.quadraticCurveTo(x+s,y,x,y+s);cx.quadraticCurveTo(x-s,y,x,y-s);cx.fill()}
 else if(k=="snow"){for(let i=0;i<3;i++){const a=i*Math.PI/3;cx.moveTo(x+Math.cos(a)*s,y+Math.sin(a)*s);cx.lineTo(x-Math.cos(a)*s,y-Math.sin(a)*s)}cx.stroke()}
 else{for(let i=0;i<6;i++){const a=i*Math.PI/3;cx.lineTo(x+Math.cos(a)*s,y+Math.sin(a)*s)}cx.closePath();cx.fill()}}
function drawBg(){const T=TH[S.theme];cx.setTransform(dpr*sc,0,0,dpr*sc,0,0);
 const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,T[1]);g.addColorStop(1,T[2]);cx.fillStyle=g;cx.fillRect(0,0,W+2,H);
 cx.fillStyle=cx.strokeStyle="rgba(255,255,255,.3)";cx.lineWidth=2;
 for(let i=0;i<16;i++){const sp=.08+(i%3)*.06,ww=W+100,x=((i*173-dist*sp)%ww+ww)%ww-50;glyph(T[5],x,60+(i*97)%(H-120),9+(i%3)*5)}
 cx.fillStyle=T[3];cx.fillRect(0,0,W+2,PT);cx.fillRect(0,H-PT,W+2,PT);cx.fillStyle="rgba(255,255,255,.35)";cx.fillRect(0,PT-3,W+2,3);cx.fillRect(0,H-PT,W+2,3)}

 :`<h2>Raté !</h2><p class="msg">Pièces ramassées : ${lvCoins}</p><button class="btn big" onclick="play(${cur})">Rejouer</button><button class="btn alt" onclick="quit()">Niveaux</button>`;
 scrs.forEach(s=>$("#"+s).classList.toggle("on",s=="end"))}

 $("#iap").innerHTML=`<h2>${c?"Acheter des pièces":"Acheter des gemmes"}</h2><p class="msg" style="opacity:.75">Mode démo : aucun vrai paiement, l’achat est simulé.</p>`+PACKS[k].map((p,i)=>`<div class="pack" onclick="buyP('${k}',${i})"><div>${IC(c?"coin":"gem")} ${p[0].toLocaleString("fr-FR")}</div><span>${p[1]} €</span></div>`).join("")+`<button class="btn alt" onclick="$('#iap').classList.remove('on')">Fermer</button>`}

$("#snd").textContent="♪";$("#snd").classList.toggle("m",S.mute);hud();go("menu");
